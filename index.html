<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PlanPal</title>
<meta name="description" content="Tell us what's going on. We'll tell you who to see and what your UBC AMS/GSS health plan pays.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* =====================================================================
     Design system: calm surface, loud numbers.
     All sizes are in rem so the "Larger text" button scales everything.
     1rem = 16px at standard size.
     ===================================================================== */
  :root {
    --bg: #FAF8F5;
    --card: #FFFFFF;
    --text: #1A1A1A;
    --muted: #5F6368;
    --accent: #0B5D4B;
    --accent-pressed: #08463A;
    --tint: #E3F2EC;
    --divider: #ECE8E3;
    --disabled: #B9C7C2;
    --safety: #B00020;
  }
  html { font-size: 100%; }
  html.large { font-size: 125%; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
    font-size: 1.125rem; line-height: 1.55; -webkit-font-smoothing: antialiased;
  }
  [hidden] { display: none !important; }
  .wrap { max-width: 30rem; margin: 0 auto; padding: 1.5rem 1.25rem 3rem; }
  h1, h2, h3 { margin: 0; line-height: 1.25; }
  p { margin: 0; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .muted { color: var(--muted); font-size: 1rem; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ===== Header + tabs ===== */
  .topbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.5rem; margin-bottom: 1rem; }
  .chip-btn { white-space: nowrap; }
  .brand { font-size: 1.75rem; font-weight: 700; }
  .top-actions { display: flex; gap: 0.5rem; }
  .chip-btn {
    min-height: 3rem; min-width: 3rem; padding: 0 0.875rem; border-radius: 0.875rem;
    border: 1.5px solid var(--divider); background: var(--card); font-size: 1rem; font-weight: 500;
  }
  .chip-btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--tint); }
  .plan-line { font-size: 1rem; color: var(--muted); margin-bottom: 1.5rem; }
  .tabs { display: flex; background: #EFEBE6; border-radius: 0.875rem; padding: 0.25rem; margin-bottom: 2rem; }
  .tab {
    flex: 1; min-height: 3rem; border: 0; border-radius: 0.75rem; background: transparent;
    font-size: 1rem; font-weight: 700; color: var(--muted);
  }
  .tab[aria-current="page"] { background: var(--card); color: var(--text); box-shadow: 0 1px 3px rgba(26,26,26,0.08); }

  /* ===== Cards, sections ===== */
  .card { background: var(--card); border-radius: 1.5rem; padding: 1.5rem; box-shadow: 0 2px 8px rgba(26,26,26,0.05); }
  .card + .card { margin-top: 1rem; }
  .section { border-top: 1px solid var(--divider); margin-top: 1.5rem; padding-top: 1.5rem; }
  .view-title { font-size: 1.375rem; font-weight: 700; margin-bottom: 0.5rem; outline: none; }
  .view-sub { font-size: 1rem; color: var(--muted); margin-bottom: 1.5rem; }

  /* ===== Form controls ===== */
  .field-label { display: block; font-weight: 700; margin-bottom: 0.5rem; }
  textarea {
    width: 100%; min-height: 7.5rem; padding: 1rem; resize: vertical; background: #fff;
    border: 1.5px solid var(--divider); border-radius: 0.875rem; outline: none;
  }
  textarea::placeholder { color: var(--muted); }
  textarea:focus, select:focus, input[type="number"]:focus { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  select {
    width: 100%; min-height: 3rem; padding: 0 1rem; background: #fff;
    border: 1.5px solid var(--divider); border-radius: 0.875rem; outline: none;
  }
  .check { display: flex; align-items: center; gap: 0.5rem; min-height: 3rem; font-size: 1rem; color: var(--muted); cursor: pointer; }
  .check input { width: 1.375rem; height: 1.375rem; margin: 0; accent-color: var(--accent); cursor: pointer; flex-shrink: 0; }
  .primary {
    width: 100%; min-height: 3.5rem; border: 0; border-radius: 0.875rem; background: var(--accent); color: #fff;
    font-size: 1.125rem; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 0.5rem;
    padding: 0.5rem 1rem; transition: background-color 150ms;
  }
  .primary:active:not(:disabled) { background: var(--accent-pressed); }
  .primary:disabled { background: var(--disabled); cursor: not-allowed; }
  .link-btn { background: none; border: 0; padding: 0; min-height: 3rem; color: var(--accent); font-weight: 700; font-size: 1rem; text-decoration: underline; text-underline-offset: 3px; }
  .spinner { width: 1.125rem; height: 1.125rem; border-radius: 50%; border: 2.5px solid rgba(255,255,255,0.4); border-top-color: #fff; animation: spin 0.8s linear infinite; flex-shrink: 0; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ===== Onboarding ===== */
  fieldset { border: 0; padding: 0; margin: 0 0 2rem; }
  legend { font-weight: 700; padding: 0; margin-bottom: 0.5rem; }
  .option {
    display: flex; align-items: center; gap: 0.75rem; min-height: 3.5rem; padding: 0.75rem 1rem; margin-top: 0.5rem;
    background: #fff; border: 1.5px solid var(--divider); border-radius: 0.875rem; cursor: pointer;
  }
  .option input { width: 1.375rem; height: 1.375rem; margin: 0; accent-color: var(--accent); flex-shrink: 0; }
  .option:has(input:checked) { border-color: var(--accent); background: var(--tint); }
  .option.disabled { color: var(--muted); cursor: not-allowed; background: transparent; }
  .option small { display: block; font-size: 0.875rem; color: var(--muted); }

  /* ===== Result card ===== */
  .result h2 { font-size: 1.375rem; font-weight: 700; margin-bottom: 0.5rem; }
  .eyebrow { font-size: 0.875rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 0.25rem; }
  .why { font-size: 1rem; color: var(--muted); }
  .hero-label { font-size: 1rem; color: var(--muted); }
  .hero { font-size: 2.5rem; font-weight: 700; line-height: 1.15; letter-spacing: -0.02em; margin: 0.25rem 0; }
  .hero-unit { font-size: 1.125rem; font-weight: 500; letter-spacing: 0; color: var(--muted); }
  .hero-note { font-size: 1rem; color: var(--muted); }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; }
  .row .label { font-size: 1rem; color: var(--muted); }
  .row .amt { font-weight: 700; }
  .bar-label { font-weight: 700; margin-bottom: 0.5rem; }
  .bar { height: 0.625rem; background: var(--divider); border-radius: 999px; overflow: hidden; }
  .bar > span { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
  .note { font-size: 1rem; color: var(--muted); margin-top: 0.5rem; }
  .tip { background: var(--tint); border-radius: 0.875rem; padding: 1rem; }
  .tip-title { font-weight: 700; font-size: 1rem; margin-bottom: 0.25rem; }
  .tip-text { font-size: 1rem; }
  .tip .call { margin-top: 1rem; background: #fff; }
  .check-note { font-size: 0.9375rem; color: var(--muted); margin-top: 1rem; padding-left: 0.75rem; border-left: 3px solid var(--divider); }
  .call {
    flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; min-height: 3rem; padding: 0 1rem;
    border-radius: 0.875rem; border: 1.5px solid var(--accent); color: var(--accent); font-weight: 700; font-size: 1rem; text-decoration: none; background: transparent;
  }
  .clinic { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: 1rem 0; }
  .clinic + .clinic { border-top: 1px solid var(--divider); }
  .clinic-name { font-weight: 700; }
  .clinic-addr { font-size: 1rem; color: var(--muted); margin-bottom: 0.5rem; }
  .pill { display: inline-block; border-radius: 999px; padding: 0.25rem 0.625rem; background: var(--tint); color: var(--accent); font-size: 0.8125rem; font-weight: 700; }
  .pill.grey { background: #F1EFEC; color: var(--muted); }
  .say-head { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; margin-bottom: 0.25rem; }
  .copy { display: inline-flex; align-items: center; gap: 0.375rem; min-height: 3rem; padding: 0 0.5rem; background: none; border: 0; color: var(--accent); font-weight: 700; font-size: 1rem; }
  .disclaimer { font-size: 0.875rem; color: var(--muted); margin-top: 1.5rem; }
  svg.icon { width: 1.25rem; height: 1.25rem; flex-shrink: 0; }

  /* ===== Reminder card ===== */
  .reminder { margin-top: 2rem; }
  .reminder h2 { font-size: 1.125rem; font-weight: 700; margin-bottom: 0.25rem; }
  .countdown { font-size: 2rem; font-weight: 700; line-height: 1.2; letter-spacing: -0.01em; margin: 0.5rem 0 0.25rem; }
  .unused { list-style: none; padding: 0; margin: 1rem 0 0; }
  .unused li { display: flex; justify-content: space-between; gap: 1rem; padding: 0.75rem 0; border-top: 1px solid var(--divider); font-size: 1rem; }
  .unused li span:last-child { font-weight: 700; white-space: nowrap; }

  /* ===== Coverage screen ===== */
  .cov h3 { font-size: 1.25rem; font-weight: 700; margin-bottom: 0.5rem; }
  .cov-plain { font-size: 1rem; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; margin-top: 1rem; }
  .stat { background: var(--bg); border-radius: 0.875rem; padding: 0.75rem 1rem; }
  .stat-label { font-size: 0.875rem; color: var(--muted); }
  .stat-value { font-size: 1.25rem; font-weight: 700; }
  .used-row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-top: 1rem; }
  .used-row label { font-size: 1rem; font-weight: 500; }
  .money-input { position: relative; width: 8rem; flex-shrink: 0; }
  .money-input span { position: absolute; left: 0.875rem; top: 50%; transform: translateY(-50%); color: var(--muted); }
  .money-input input {
    width: 100%; min-height: 3rem; padding: 0 0.75rem 0 1.75rem; background: #fff; text-align: right;
    border: 1.5px solid var(--divider); border-radius: 0.875rem; outline: none;
  }
  .left-line { font-size: 1rem; font-weight: 700; color: var(--accent); margin-top: 0.5rem; }
  .banner { background: var(--tint); border-radius: 0.875rem; padding: 1rem; margin-bottom: 1rem; font-size: 1rem; }

  /* ===== Safety screen ===== */
  .safety { position: fixed; inset: 0; z-index: 100; overflow-y: auto; background: var(--safety); color: #fff; display: flex; flex-direction: column; justify-content: center; padding: 3rem 1.5rem; }
  .safety-inner { max-width: 30rem; width: 100%; margin: 0 auto; }
  .safety h2 { font-size: 2rem; font-weight: 700; line-height: 1.2; margin: 1rem 0; outline: none; }
  .safety p { margin: 0 0 1.5rem; }
  .safety-btn { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 4rem; padding: 0.5rem 1rem; border-radius: 0.75rem; font-size: 1.25rem; font-weight: 700; text-decoration: none; margin-bottom: 1rem; }
  .safety-btn.main { background: #fff; color: var(--safety); }
  .safety-btn.secondary { background: transparent; color: #fff; border: 2px solid #fff; }
  .safety :focus-visible { outline-color: #fff; }
  .back { display: inline-flex; align-items: center; min-height: 3rem; margin-top: 1rem; background: none; border: 0; padding: 0; color: #fff; font-size: 1rem; text-decoration: underline; }

  /* ===== Additions: language picker, speak, examples, places ===== */
  .plan-line { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 0.75rem; }
  .lang-pick { position: relative; }
  .lang-pick select {
    width: auto; min-height: 2.75rem; padding: 0 2rem 0 0.875rem; font-size: 1rem; font-weight: 500;
    background: var(--card); border: 1.5px solid var(--divider); border-radius: 0.875rem;
    appearance: none; -webkit-appearance: none;
  }
  .lang-pick::after { content: ""; position: absolute; right: 0.875rem; top: 50%; width: 0.45rem; height: 0.45rem;
    border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: translateY(-70%) rotate(45deg); pointer-events: none; }
  .input-tools { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.5rem; margin-top: 0.5rem; }
  .speak-btn {
    display: inline-flex; align-items: center; gap: 0.5rem; min-height: 3rem; padding: 0 1rem;
    border-radius: 0.875rem; border: 1.5px solid var(--accent); background: var(--card); color: var(--accent);
    font-weight: 700; font-size: 1rem; transition: background-color 150ms;
  }
  .speak-btn[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .speak-status { font-size: 0.9375rem; color: var(--muted); margin-top: 0.5rem; min-height: 0; }
  .examples-label { font-size: 0.9375rem; color: var(--muted); margin: 1rem 0 0.5rem; }
  .examples { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  .ex-chip {
    min-height: 2.75rem; padding: 0.375rem 0.875rem; border-radius: 999px; border: 1.5px solid var(--divider);
    background: var(--card); font-size: 0.9375rem; text-align: left; line-height: 1.35;
  }
  .ex-chip:active { background: var(--tint); }
  .place { padding: 1rem 0; }
  .place + .place { border-top: 1px solid var(--divider); }
  .place-name { font-weight: 700; }
  .place-addr { font-size: 0.9375rem; color: var(--muted); margin: 0.125rem 0 0.5rem; }
  .place-tags { display: flex; flex-wrap: wrap; gap: 0.375rem; margin-bottom: 0.75rem; }
  .place-actions { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  .place-actions .call { min-height: 2.75rem; }
  .call.solid { background: var(--accent); color: #fff; }
  details.places { margin-top: 1rem; border-top: 1px solid var(--divider); padding-top: 0.5rem; }
  details.places summary { min-height: 3rem; display: flex; align-items: center; font-weight: 700; font-size: 1rem; color: var(--accent); cursor: pointer; list-style: none; }
  details.places summary::-webkit-details-marker { display: none; }
  details.places summary::after { content: "+"; margin-left: auto; font-size: 1.25rem; }
  details.places[open] summary::after { content: "−"; }
</style>

</head>
<body>

<div id="app">
  <div class="wrap">

    <!-- ================= SETUP ================= -->
    <section id="view-onboarding" aria-labelledby="ob-title">
      <p class="brand">PlanPal</p>
      <p class="muted" style="margin:0.5rem 0 2rem" data-i18n="ob_tagline"></p>
      <h1 class="view-title" id="ob-title" tabindex="-1" data-i18n="ob_title"></h1>
      <p class="view-sub" data-i18n="ob_sub"></p>

      <form id="ob-form" novalidate>
        <fieldset>
          <legend><label for="ob-language" data-i18n="ob_q_lang"></label></legend>
          <select id="ob-language" name="language"></select>
          <p class="note" data-i18n="ob_lang_note"></p>
        </fieldset>

        <fieldset>
          <legend data-i18n="ob_q_plan"></legend>
          <label class="option"><input type="radio" name="plan" value="AMS/GSS" checked>
            <span><span data-i18n="ob_plan_ams"></span><small data-i18n="ob_plan_ams_sub"></small></span></label>
          <label class="option disabled"><input type="radio" name="plan" value="other" disabled>
            <span><span data-i18n="ob_plan_other"></span><small data-i18n="ob_coming_soon"></small></span></label>
        </fieldset>

        <fieldset>
          <legend data-i18n="ob_q_usage"></legend>
          <label class="option"><input type="radio" name="usage" value="no"><span data-i18n="ob_no"></span></label>
          <label class="option"><input type="radio" name="usage" value="yes"><span><span data-i18n="ob_yes"></span><small data-i18n="ob_yes_sub"></small></span></label>
          <label class="option"><input type="radio" name="usage" value="unsure" checked><span data-i18n="ob_unsure"></span></label>
        </fieldset>

        <button class="primary" type="submit" data-i18n="ob_start"></button>
      </form>
    </section>

    <!-- ================= MAIN APP ================= -->
    <div id="main" hidden>
      <header class="topbar">
        <p class="brand">PlanPal</p>
        <div class="top-actions">
          <button class="chip-btn" id="btn-large" type="button" aria-pressed="false" data-i18n="top_larger"></button>
          <button class="chip-btn" id="btn-settings" type="button" data-i18n="top_settings"></button>
        </div>
      </header>
      <div class="plan-line">
        <span data-i18n="plan_line"></span>
        <span class="lang-pick">
          <label class="sr-only" for="top-language" data-i18n="top_language"></label>
          <select id="top-language"></select>
        </span>
      </div>

      <nav class="tabs" data-i18n-aria="tabs_label">
        <button class="tab" type="button" data-view="ask" aria-current="page" data-i18n="tab_ask"></button>
        <button class="tab" type="button" data-view="coverage" data-i18n="tab_coverage"></button>
      </nav>

      <!-- ---------- ASK ---------- -->
      <section id="view-ask" aria-labelledby="ask-title">
        <h1 class="view-title" id="ask-title" tabindex="-1" data-i18n="ask_title"></h1>
        <p class="view-sub" data-i18n="ask_sub"></p>

        <label class="sr-only" for="message" data-i18n="ask_label"></label>
        <textarea id="message" dir="auto" data-i18n-placeholder="ask_placeholder"></textarea>

        <div class="input-tools">
          <button class="speak-btn" id="speak" type="button" aria-pressed="false">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/></svg>
            <span id="speak-label"></span>
          </button>
          <label class="check">
            <input type="checkbox" id="remember"> <span data-i18n="remember"></span>
          </label>
        </div>
        <p class="speak-status" id="speak-status" aria-live="polite" hidden></p>

        <p class="examples-label" data-i18n="ask_try"></p>
        <div class="examples">
          <button class="ex-chip" type="button" data-example="ex_ankle"></button>
          <button class="ex-chip" type="button" data-example="ex_stress"></button>
          <button class="ex-chip" type="button" data-example="ex_teeth"></button>
          <button class="ex-chip" type="button" data-example="ex_eyes"></button>
        </div>

        <button class="primary" id="ask" type="button" style="margin-top:1.5rem" disabled></button>

        <section class="card result" id="result" aria-live="polite" style="margin-top:2rem" hidden></section>

        <section class="card reminder" id="reminder" aria-labelledby="reminder-title"></section>
      </section>

      <!-- ---------- COVERAGE ---------- -->
      <section id="view-coverage" aria-labelledby="cov-title" hidden>
        <h1 class="view-title" id="cov-title" tabindex="-1" data-i18n="cov_title"></h1>
        <p class="view-sub" id="cov-sub"></p>
        <div id="cov-banner"></div>
        <div id="cov-list"></div>
      </section>
    </div>

  </div>
</div>

<!-- ================= SAFETY SCREEN ================= -->
<div class="safety" id="safety" role="alertdialog" aria-modal="true" aria-labelledby="safety-heading" hidden>
  <div class="safety-inner">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width:2rem;height:2rem"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
    <h2 id="safety-heading" tabindex="-1"></h2>
    <div id="safety-actions"></div>
    <button class="back" id="safety-back" type="button" data-i18n="s_back"></button>
  </div>
</div>

<script>
"use strict";
/* =========================================================================
   TRANSLATIONS
   Menus, buttons and plan descriptions. Answers from the server come back in
   whatever language the student picked; this table only covers the page.
   Every key in "en" must exist in every other language (the test checks).
   Placeholders like {date} are filled in by the code.
   ========================================================================= */
const I18N = {
  en: {
    ob_tagline: "Your UBC health plan, in plain language. Three quick questions and you're in.",
    ob_title: "Let's set you up",
    ob_sub: "Takes about 30 seconds.",
    ob_q_lang: "1. Which language do you prefer?",
    ob_lang_note: "Answers will come back in this language.",
    ob_q_plan: "2. Which plan are you on?",
    ob_plan_ams: "AMS/GSS Student Health Plan",
    ob_plan_ams_sub: "Every UBC student is enrolled by default",
    ob_plan_other: "A different plan",
    ob_coming_soon: "Coming soon",
    ob_q_usage: "3. Have you used your plan since September 1?",
    ob_no: "No, not yet",
    ob_yes: "Yes",
    ob_yes_sub: "We'll ask roughly how much, so we can show what's left",
    ob_unsure: "Not sure",
    ob_start: "Get started",
    lang_auto: "Match the language I type in",
    top_larger: "Larger text",
    top_settings: "Settings",
    top_language: "Language",
    plan_line: "AMS/GSS plan",
    tabs_label: "Sections",
    tab_ask: "Ask",
    tab_coverage: "My coverage",
    ask_title: "What's going on?",
    ask_sub: "Type or speak, in any language. We'll tell you who to see and what your plan pays.",
    ask_label: "Describe what's going on",
    ask_placeholder: "e.g. I hurt my ankle playing soccer",
    ask_try: "Or tap one:",
    ex_ankle: "I sprained my ankle playing soccer",
    ex_stress: "I'm really stressed about exams",
    ex_teeth: "I need a dental cleaning",
    ex_eyes: "My eyes get blurry when I read",
    speak: "Speak",
    speak_stop: "Stop",

function save() {
  if (!state.remember) return;
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      remember: true, onboarded: state.onboarded, plan: state.plan, language: state.language,
      usageKnown: state.usageKnown, used: state.used, eyeUsed: state.eyeUsed, large: state.large,
    }));

}

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const s = JSON.parse(raw);
    if (!s || s.remember !== true) return;
    state.remember = true;
    state.onboarded = s.onboarded === true;
    state.language = LANGUAGES.some(l => l.code === s.language) ? s.language : "auto";
    state.usageKnown = s.usageKnown === true;
    state.used = {};
    if (s.used && typeof s.used === "object") {
      for (const k of CATEGORY_ORDER) {
        const v = Number(s.used[k]);
        if (isFinite(v) && v >= 0) state.used[k] = v;

    state.eyeUsed = s.eyeUsed === true;
    state.large = s.large === true;

}

/* =========================================================================

   Same English lists as the team's safety.py, with two fixes: "hurt myself"
   removed (it caught "I hurt myself playing soccer") and whole-word matching
   (so "backstroke" doesn't match "stroke"). A few unambiguous phrases in the
   translated languages are added. The server's red_flag still decides for
   everything else.
   ========================================================================= */
const EMERGENCY_911 = [
  "chest pain", "chest pressure", "heart attack", "can't breathe", "cannot breathe",
  "cant breathe", "trouble breathing", "difficulty breathing", "not breathing", "choking",
  "stroke", "face drooping", "slurred speech", "sudden numbness", "can't move one side",
  "passed out", "unconscious", "unresponsive", "fainted", "seizure",
  "overdose", "overdosed", "took too many pills", "poisoned", "poisoning",
  "anaphylaxis", "throat closing", "throat swelling", "severe allergic",
  "bleeding heavily", "won't stop bleeding", "coughing up blood", "vomiting blood",
  "hit my head", "head injury", "bone sticking out", "severe burn",
  "going to hurt someone", "kill someone",
];
const CRISIS_988 = [
  "suicide", "suicidal", "kill myself", "end my life", "end it all", "want to die",
  "wanna die", "don't want to live", "dont want to live", "don't want to be alive",
  "better off dead", "no reason to live", "self harm", "self-harm",
  "harm myself", "cut myself", "cutting myself", "tried to kill myself",
];
const EMERGENCY_911_OTHER = ["胸痛", "呼吸困难", "呼吸困難", "가슴 통증", "숨을 못 쉬", "सीने में दर्द", "ਛਾਤੀ ਵਿੱਚ ਦਰਦ"];
const CRISIS_988_OTHER = ["自杀", "自殺", "不想活", "자살", "आत्महत्या", "ਖ਼ੁਦਕੁਸ਼ੀ", "ਖੁਦਕੁਸ਼ੀ"];

function normalize(text) {
  return String(text || "").toLowerCase()
    .replace(/[‘’ʼ`´]/g, "'")
    .replace(/\s+/g, " ");
}
function escapeRe(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }
function phraseRegex(list) {
  return new RegExp("(^|[^a-z0-9])(" + list.map(escapeRe).join("|") + ")(?=$|[^a-z0-9])");
}
const RE_911 = phraseRegex(EMERGENCY_911);
const RE_988 = phraseRegex(CRISIS_988);
function detectSafety(text) {
  const t0 = normalize(text);
  if (RE_911.test(t0) || EMERGENCY_911_OTHER.some(p => t0.includes(p))) return "911";
  if (RE_988.test(t0) || CRISIS_988_OTHER.some(p => t0.includes(p))) return "988";
  return null;
}

/* =========================================================================
   6. SERVER
   Request:  POST { question, language, plan }
   Response: { language, red_flag: null|"911"|"988"|"811", category,
               why_one_line, coverage: { per_visit, per_year } | null, echo }
   Optional: clinics (replaces the built-in list), what_to_say
   ========================================================================= */
function mockResponse(question) {
  const q = normalize(question);
  const base = { language: "en", red_flag: null, category: null, why_one_line: "", coverage: null, echo: question };
  const s = detectSafety(q);
  if (s) return { ...base, red_flag: s };
  const pick = (cat, why) => ({ ...base, category: cat, why_one_line: why,
    coverage: COVERAGE[cat].per_visit != null || COVERAGE[cat].annual_max != null
      ? { per_visit: COVERAGE[cat].per_visit, per_year: COVERAGE[cat].annual_max } : null });
  const has = (...words) => words.some(w => q.includes(w));
  if (has("ankle", "knee", "back", "sprain", "shoulder", "脚踝", "腳踝", "ਗਿੱਟ", "टखन", "발목")) return pick("physio", "Sprains and joint pain are usually treated by a physiotherapist.");
  if (has("sore muscles", "tight", "tension", "neck")) return pick("massage", "Muscle tension is often helped by a registered massage therapist.");
  if (has("stress", "anxious", "sad", "overwhelmed", "压力", "壓力", "ਤਣਾਅ", "तनाव", "스트레스")) return pick("counselling", "Talking to someone can help. Counselling is well covered by your plan.");
  if (has("teeth", "tooth", "cleaning", "dentist", "洗牙", "ਦੰਦ", "दाँत", "스케일링")) return pick("dental_cleaning", "A regular cleaning is covered, and free at a network dentist.");
  if (has("eye", "glasses", "contacts", "vision", "blurry", "眼睛", "ਧੁੰਦਲਾ", "धुंधला", "눈이")) return pick("eye_exam", "An optometrist can check your eyes and update your prescription.");
  if (has("fever", "rash")) return { ...pick("doctor_visit", "Doctor visits are covered by MSP, so they're free."), red_flag: "811" };
  if (has("stomach", "sick", "cough", "cold")) return pick("doctor_visit", "Doctor visits are covered by MSP, so they're free.");
  return { ...base, why_one_line: "Try describing where it hurts or what happened." };
}

function hasNum(n) { return n !== null && n !== undefined && n !== "" && isFinite(Number(n)); }

function cleanResponse(d) {
  d = d && typeof d === "object" ? d : {};
  const flag = d.red_flag == null ? null : String(d.red_flag).trim();
  const catKey = d.category ? String(d.category).toLowerCase().trim() : null;
  const cov = d.coverage && typeof d.coverage === "object" ? d.coverage : null;
  return {
    emergency: flag === "911" || flag === "988" ? flag : null,
    nurse: flag === "811",
    language: typeof d.language === "string" && d.language ? d.language : "en",
    category: catKey,
    why: typeof d.why_one_line === "string" ? d.why_one_line : "",
    per_visit: cov && hasNum(cov.per_visit) ? Number(cov.per_visit) : null,
    per_year: cov && hasNum(cov.per_year) ? Number(cov.per_year) : null,
    clinics: Array.isArray(d.clinics) ? d.clinics : null,
    what_to_say: typeof d.what_to_say === "string" ? d.what_to_say : "",
  };
}

async function askServer(question) {
  if (!API_URL) {
    await new Promise(r => setTimeout(r, 900));
    return cleanResponse(mockResponse(question));
  }
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), TIMEOUT_MS);
  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question, language: state.language, plan: state.plan }),
      signal: ctrl.signal,
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    return cleanResponse(await res.json());
  } finally {
    clearTimeout(timer);
  }
}

// Wake the free server as soon as the page opens.

  try { fetch(new URL(API_URL).origin + "/health").catch(() => {}); } catch (e) {}
}

const PHONE_ICON = ["M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"];
const COPY_ICON = ["M8 8h12v12H8z", "M4 16V6a2 2 0 0 1 2-2h10"];
const PIN_ICON = ["M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z", "M12 13a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"];
function prettyCategory(key) {
  if (!key) return t("res_unsure");
  const s = key.replace(/[_-]+/g, " ").trim();
  return s.charAt(0).toUpperCase() + s.slice(1);
}
function remainingFor(cat, annual) {
  if (!state.usageKnown || !hasNum(annual)) return null;
  return Math.max(0, annual - Number(state.used[cat] || 0));
}
function telHref(phone) { return "tel:" + String(phone).replace(/[^\d+]/g, ""); }
function mapsHref(p) {
  return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent([p.name, p.address].filter(Boolean).join(", "));
}

/* ---------- Places list (used in the answer card and My coverage) ---------- */
function placesFor(cat, fromServer) {
  if (Array.isArray(fromServer) && fromServer.length) return fromServer;
  return (typeof CLINICS !== "undefined" && CLINICS[cat]) ? CLINICS[cat] : [];
}
function renderPlaces(list) {
  const wrap = el("div", {});
  list.forEach(p => {
    if (!p || typeof p !== "object" || !p.name) return;
    const tags = [];
    if (p.on_campus === true) tags.push(el("span", { class: "pill grey" }, t("res_on_campus")));
    if (p.direct_billing === true || p.direct_billing === "yes") tags.push(el("span", { class: "pill" }, t("res_direct")));
    const actions = el("div", { class: "place-actions" });
    if (p.phone) actions.append(el("a", { class: "call solid", href: telHref(p.phone), "aria-label": t("res_call") + " " + p.name + " " + p.phone }, icon(PHONE_ICON), t("res_call") + " " + p.phone));
    if (p.address) actions.append(el("a", { class: "call", href: mapsHref(p), target: "_blank", rel: "noopener" }, icon(PIN_ICON), t("res_directions")));
    wrap.append(el("div", { class: "place" },
      el("p", { class: "place-name" }, String(p.name)),
      p.address ? el("p", { class: "place-addr" }, String(p.address)) : null,
      tags.length ? el("div", { class: "place-tags" }, ...tags) : null,
      actions));
  });
  return wrap;
}

/* =========================================================================
   8. VIEWS
   ========================================================================= */
const views = { ask: $("view-ask"), coverage: $("view-coverage") };
let currentView = "ask";

function showOnboarding() {
  stopListening();
  $("main").hidden = true;
  $("view-onboarding").hidden = false;
  const form = $("ob-form");
  form.language.value = state.language;
  const usage = state.usageKnown ? (Object.values(state.used).some(v => v > 0) || state.eyeUsed ? "yes" : "no") : "unsure";
  form.querySelector(`input[name="usage"][value="${usage}"]`).checked = true;
  $("ob-title").focus();
}

function showMain(view) {
  $("view-onboarding").hidden = true;
  $("main").hidden = false;
  switchView(view || "ask", false);
}

function switchView(name, moveFocus) {
  currentView = name;
  if (name !== "ask") stopListening();
  for (const [k, node] of Object.entries(views)) node.hidden = k !== name;
  document.querySelectorAll(".tab").forEach(tb => {
    if (tb.dataset.view === name) tb.setAttribute("aria-current", "page"); else tb.removeAttribute("aria-current");
  });
  if (name === "coverage") renderCoverage();
  if (name === "ask") renderReminder();
  if (moveFocus !== false) $(name === "ask" ? "ask-title" : "cov-title").focus();
}

function refreshLanguage() {
  applyI18n();
  if (!$("main").hidden) {
    if (currentView === "coverage") renderCoverage(); else renderReminder();
    if (lastResult && !resultEl.hidden) renderResult(lastResult);
  }
}

/* ---------- Answer card ---------- */
const resultEl = $("result");

function moneyBlock(cat, info, r) {
  const sec = el("div", { class: "section" });
  const perVisit = r.per_visit != null ? r.per_visit : (info ? info.per_visit : null);
  const annual = r.per_year != null ? r.per_year : (info ? info.annual_max : null);

  if (info && info.free) {
    sec.append(el("p", { class: "hero-label" }, t("res_cost_you")),
      el("p", { class: "hero" }, "$0"),
      el("p", { class: "hero-note" }, t("res_msp")));
    return sec;
  }
  if (hasNum(perVisit)) {
    sec.append(el("p", { class: "hero-label" }, t("res_pays_back")),
      el("p", { class: "hero" }, money(perVisit), el("span", { class: "hero-unit" }, " " + t(info && info.per_session ? "unit_session" : "unit_visit"))),
      el("p", { class: "hero-note" }, t("res_rest")));
  } else if (info && hasNum(info.percent)) {
    sec.append(el("p", { class: "hero-label" }, t("res_plan_pays")),
      el("p", { class: "hero" }, info.percent + "%", el("span", { class: "hero-unit" }, " " + t("unit_cost"))),
      el("p", { class: "hero-note" }, tc(cat, "plain")));
  } else if (info) {
    sec.append(el("p", { class: "cov-plain" }, tc(cat, "plain")));
  }

  if (hasNum(annual)) {
    const left = remainingFor(cat, annual);
    const box = el("div", { style: "margin-top:1.5rem" });
    if (left !== null) {
      const pct = annual > 0 ? Math.max(0, Math.min(100, (left / annual) * 100)) : 0;
      const label = t("res_left_of", { left: money(left), total: money(annual) });
      box.append(el("p", { class: "bar-label" }, label),
        el("div", { class: "bar", role: "progressbar", "aria-valuemin": "0", "aria-valuemax": String(annual), "aria-valuenow": String(left), "aria-label": label },
          el("span", { style: "width:" + pct + "%" })));
    } else {
      const update = el("button", { class: "link-btn", type: "button" }, t("res_add_used"));
      update.addEventListener("click", () => switchView("coverage"));
      box.append(el("div", { class: "row" }, el("span", { class: "label" }, t("res_yearly_max")), el("span", { class: "amt" }, money(annual))), update);
    }
    if (info && tc(cat, "shared")) box.append(el("p", { class: "note" }, tc(cat, "shared")));
    sec.append(box);
  }
  const reset = planReset();
  sec.append(el("p", { class: "note" }, t("res_resets", { date: reset.label, days: daysText(reset.days) })));
  if (info && !info.verified) sec.append(el("p", { class: "check-note" }, t("res_confirm")));
  return sec;
}

function renderResult(r) {
  lastResult = r;
  resultEl.replaceChildren();
  const info = r.category ? COVERAGE[r.category] : null;
  const who = info ? tc(r.category, "who") : prettyCategory(r.category);

  resultEl.append(el("p", { class: "eyebrow" }, r.category ? t("res_who") : t("res_hmm")), el("h2", {}, who));
  if (r.why) resultEl.append(el("p", { class: "why", lang: r.language, dir: "auto" }, r.why));

  if (info || r.per_visit != null || r.per_year != null) resultEl.append(moneyBlock(r.category, info, r));

  if (info && tc(r.category, "where")) {
    resultEl.append(el("div", { class: "section" },
      el("div", { class: "tip" },
        el("p", { class: "tip-title" }, info.free ? t("res_where") : t("res_cheaper")),
        el("p", { class: "tip-text" }, tc(r.category, "where")))));
  }

  if (r.nurse) {
    resultEl.append(el("div", { class: "section" },
      el("div", { class: "tip" },
        el("p", { class: "tip-title" }, t("res_nurse_title")),
        el("p", { class: "tip-text" }, t("res_nurse_text")),
        el("a", { class: "call", href: "tel:811" }, icon(PHONE_ICON), t("res_call_811")))));
  }

  const places = r.category ? placesFor(r.category, r.clinics) : (r.clinics || []);
  if (places.length) {
    resultEl.append(el("div", { class: "section" },
      el("p", { class: "tip-title" }, t("res_places")),
      el("p", { class: "note", style: "margin:0 0 0.25rem" }, t("res_places_note")),
      renderPlaces(places.slice(0, 3))));
  }

  const script = r.what_to_say || (info && !info.no_script ? CALL_SCRIPT : "");
  if (script) {
    const copyBtn = el("button", { class: "copy", type: "button", "aria-label": t("copy_label") }, icon(COPY_ICON), el("span", {}, t("copy")));
    copyBtn.addEventListener("click", () => copyText(script, copyBtn));
    resultEl.append(el("div", { class: "section" },
      el("div", { class: "tip" },
        el("div", { class: "say-head" }, el("p", { class: "tip-title" }, t("res_say")), copyBtn),
        el("p", { class: "tip-text", lang: "en", dir: "ltr" }, script))));
  }

  resultEl.append(el("p", { class: "disclaimer" }, t("disclaimer")));
  resultEl.hidden = false;
}

function renderError() {
  lastResult = null;
  resultEl.replaceChildren(el("p", {}, t("err_server")));
  resultEl.hidden = false;
}

async function copyText(text, btn) {
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch (e) {
    const ta = el("textarea", { class: "sr-only", "aria-hidden": "true" }); ta.value = text;
    document.body.append(ta); ta.select();
    try { ok = document.execCommand("copy"); } catch (e2) {}
    ta.remove();
  }
  const label = btn.querySelector("span");
  label.textContent = ok ? t("copied") : t("copy_failed");
  setTimeout(() => { label.textContent = t("copy"); }, 2000);
}

/* ---------- Reminder: use it before Aug 31 ---------- */
function renderReminder() {
  const box = $("reminder");
  const reset = planReset();
  box.replaceChildren(
    el("h2", { id: "reminder-title" }, t("rem_title", { date: reset.short })),
    el("p", { class: "countdown" }, daysText(reset.days)),
    el("p", { class: "muted" }, t("rem_until", { date: reset.label })));

  if (!state.usageKnown) {
    const b = el("button", { class: "link-btn", type: "button" }, t("res_add_used"));
    b.addEventListener("click", () => switchView("coverage"));
    box.append(b);
    return;
  }
  const items = [];
  for (const cat of REMINDER_ORDER) {
    const c = COVERAGE[cat];
    if (c.track === "flag") { if (!state.eyeUsed) items.push([tc(cat, "title"), t("rem_not_used")]); continue; }
    if (c.track !== "money" || !hasNum(c.annual_max)) continue;
    if (Number(state.used[cat] || 0) === 0) items.push([tc(cat, "title") + (c.two_a_year ? " " + t("rem_two") : ""), t("rem_unused", { amt: money(c.annual_max) })]);
  }
  if (!items.length) {
    box.append(el("p", { style: "margin-top:1rem;font-size:1rem" }, t("rem_all")));
    return;
  }
  box.append(el("p", { style: "margin-top:1rem;font-weight:700;font-size:1rem" }, t("rem_not_yet")),
    el("ul", { class: "unused" }, ...items.map(([a, b]) => el("li", {}, el("span", {}, a), el("span", {}, b)))));
}

/* ---------- My coverage ---------- */
function renderCoverage() {
  const reset = planReset();
  $("cov-sub").textContent = t("cov_sub", { days: daysText(reset.days) });
  const banner = $("cov-banner");
  banner.replaceChildren();
  if (!state.usageKnown) banner.append(el("div", { class: "banner" }, t("cov_banner")));

  const list = $("cov-list");
  list.replaceChildren();
  for (const cat of CATEGORY_ORDER) {
    const c = COVERAGE[cat];
    const card = el("article", { class: "card cov", "aria-labelledby": "cov-h-" + cat });
    card.append(el("h3", { id: "cov-h-" + cat }, tc(cat, "title")), el("p", { class: "cov-plain" }, tc(cat, "plain")));

    const stats = [];
    if (c.free) stats.push([t("cov_you_pay"), "$0"]);
    if (hasNum(c.per_visit)) stats.push([t(c.per_session ? "cov_per_session" : "cov_per_visit"), t("cov_up_to", { amt: money(c.per_visit) })]);
    if (hasNum(c.percent) && !hasNum(c.per_visit) && !c.free) stats.push([t("cov_plan_pays"), c.percent + "%"]);
    if (hasNum(c.annual_max)) stats.push([t("cov_per_year"), money(c.annual_max)]);
    if (stats.length) card.append(el("div", { class: "stats" }, ...stats.map(([l, v]) =>
      el("div", { class: "stat" }, el("p", { class: "stat-label" }, l), el("p", { class: "stat-value" }, v)))));
    if (c.percent_network) card.append(el("p", { class: "note" }, t("cov_network", { p: c.percent_network })));

    if (c.track === "money" && hasNum(c.annual_max)) {
      const id = "used-" + cat;
      const input = el("input", { id, type: "number", inputmode: "decimal", min: "0", step: "1", placeholder: "0" });
      input.value = state.usageKnown ? String(state.used[cat] || 0) : "";
      const leftLine = el("p", { class: "left-line", "aria-live": "polite" });
      const updateLeft = () => {
        const left = remainingFor(cat, c.annual_max);
        leftLine.textContent = left === null ? "" : t("cov_left", { amt: money(left) });
      };
      input.addEventListener("input", () => {
        let v = Number(input.value);
        if (!isFinite(v) || v < 0 || input.value === "") v = 0;
        state.used[cat] = v;
        state.usageKnown = true;
        save();
        updateLeft();
      });
      card.append(el("div", { class: "used-row" },
        el("label", { for: id }, t("cov_used")),
        el("div", { class: "money-input" }, el("span", { "aria-hidden": "true" }, "$"), input)), leftLine);
      if (tc(cat, "shared")) card.append(el("p", { class: "note" }, tc(cat, "shared")));
      updateLeft();
    } else if (c.track === "flag") {
      const cb = el("input", { type: "checkbox", id: "used-" + cat });
      cb.checked = state.eyeUsed;
      cb.addEventListener("change", () => { state.eyeUsed = cb.checked; state.usageKnown = true; save(); });
      card.append(el("label", { class: "check", style: "margin-top:0.5rem;color:var(--text)" }, cb, el("span", {}, t("cov_had_one"))));
    }

    if (tc(cat, "where")) card.append(el("div", { class: "tip", style: "margin-top:1rem" },
      el("p", { class: "tip-title" }, c.free ? t("res_where") : t("res_cheaper")), el("p", { class: "tip-text" }, tc(cat, "where"))));
    if (!c.verified) card.append(el("p", { class: "check-note" }, t("cov_confirm")));

    const places = placesFor(cat, null);
    if (places.length) {
      card.append(el("details", { class: "places" },
        el("summary", {}, t("res_places") + " (" + places.length + ")"),
        el("p", { class: "note", style: "margin:0" }, t("res_places_note")),
        renderPlaces(places)));
    }
    list.append(card);
  }
}

/* ---------- Safety screen ---------- */
const safetyEl = $("safety");
function showSafety(type) {
  stopListening();
  const heading = $("safety-heading");
  const actions = $("safety-actions");
  actions.replaceChildren();
  if (type === "988") {
    heading.textContent = t("s988_title");
    actions.append(
      el("a", { class: "safety-btn main", href: "tel:988" }, t("s988_call")),
      el("a", { class: "safety-btn secondary", href: "sms:988" }, t("s988_text")),
      el("p", {}, t("s988_note")));
  } else {
    heading.textContent = t("s911_title");
    actions.append(el("a", { class: "safety-btn main", href: "tel:911" }, t("s911_call")),
      el("p", {}, t("s911_note")));
  }
  resultEl.hidden = true;
  safetyEl.hidden = false;
  $("app").setAttribute("aria-hidden", "true");
  document.body.style.overflow = "hidden";
  heading.focus();
}
$("safety-back").addEventListener("click", () => {
  safetyEl.hidden = true;
  $("app").removeAttribute("aria-hidden");
  document.body.style.overflow = "";
  input.value = "";
  askBtn.disabled = true;
  input.focus();
});

/* =========================================================================
   9. SPEAK (browser speech recognition)
   Works in Chrome, Edge and Safari. Some browsers send the audio to their
   own speech service to turn it into text. Firefox doesn't support it, so
   the button explains how to use the keyboard's microphone instead.
   ========================================================================= */
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition || null;
const speakBtn = $("speak");
const speakStatus = $("speak-status");
let rec = null;
let listening = false;

function speechLocale() {
  const code = state.language === "auto" ? uiLang() : state.language;
  return langInfo(code).speech || navigator.language || "en-CA";
}
function speechLangName() {
  const code = state.language === "auto" ? uiLang() : state.language;
  return langInfo(code).name;
}
function setSpeakStatus(msg) { speakStatus.textContent = msg || ""; speakStatus.hidden = !msg; }
function updateSpeakButton() {
  $("speak-label").textContent = listening ? t("speak_stop") : t("speak");
  speakBtn.setAttribute("aria-pressed", String(listening));
}
function stopListening() {
  if (rec && listening) { try { rec.stop(); } catch (e) {} }
}
speakBtn.addEventListener("click", () => {
  if (!SpeechRec) { setSpeakStatus(t("speak_unsupported")); return; }
  if (listening) { stopListening(); return; }

  const base = input.value.trim() ? input.value.trim() + " " : "";
  let heard = false;
  rec = new SpeechRec();
  rec.lang = speechLocale();
  rec.interimResults = true;
  rec.continuous = true;
  rec.onresult = e => {
    let finalText = "", interim = "";
    for (let i = 0; i < e.results.length; i++) {
      const r = e.results[i];
      if (r.isFinal) finalText += r[0].transcript; else interim += r[0].transcript;
    }
    if ((finalText + interim).trim()) heard = true;
    input.value = base + finalText + interim;
    askBtn.disabled = busy || !input.value.trim();
  };
  rec.onerror = e => {
    if (e.error === "not-allowed" || e.error === "service-not-allowed") setSpeakStatus(t("speak_denied"));
    else if (e.error !== "aborted") setSpeakStatus(t("speak_nothing"));
  };
  rec.onend = () => {
    listening = false;
    updateSpeakButton();
    if (heard) { setSpeakStatus(""); input.focus(); }
    else if (!speakStatus.textContent || speakStatus.textContent === t("speak_listening", { lang: speechLangName() })) setSpeakStatus(t("speak_nothing"));
  };
  try {
    rec.start();
    listening = true;
    updateSpeakButton();
    setSpeakStatus(t("speak_listening", { lang: speechLangName() }));
  } catch (e) {
    listening = false;
    updateSpeakButton();
    setSpeakStatus(t("speak_nothing"));
  }
});

/* =========================================================================
   10. EVENTS
   ========================================================================= */
const input = $("message");
const askBtn = $("ask");
let busy = false;

// Language: setup screen and header picker switch everything immediately.
$("ob-language").addEventListener("change", e => { state.language = e.target.value; save(); refreshLanguage(); });
$("top-language").addEventListener("change", e => { state.language = e.target.value; save(); refreshLanguage(); });

$("ob-form").addEventListener("submit", e => {
  e.preventDefault();
  const f = e.target;
  state.plan = PLAN;
  state.language = f.language.value || "auto";
  const usage = (f.querySelector('input[name="usage"]:checked') || {}).value || "unsure";
  if (usage === "no") { state.usageKnown = true; state.used = {}; state.eyeUsed = false; }
  else if (usage === "unsure") { state.usageKnown = false; }
  else if (usage === "yes") { state.usageKnown = true; }
  state.onboarded = true;
  save();
  applyI18n();
  showMain(usage === "yes" ? "coverage" : "ask");
});

document.querySelectorAll(".tab").forEach(tb => tb.addEventListener("click", () => switchView(tb.dataset.view)));
$("btn-settings").addEventListener("click", showOnboarding);

const largeBtn = $("btn-large");
function applyLarge() {
  document.documentElement.classList.toggle("large", state.large);
  largeBtn.setAttribute("aria-pressed", String(state.large));
}
largeBtn.addEventListener("click", () => { state.large = !state.large; applyLarge(); save(); });

const rememberBox = $("remember");
rememberBox.addEventListener("change", () => {
  state.remember = rememberBox.checked;
  if (state.remember) save(); else forget();
});

document.querySelectorAll("[data-example]").forEach(b => b.addEventListener("click", () => {
  stopListening();
  input.value = t(b.dataset.example);
  askBtn.disabled = busy;
  input.focus();
}));

input.addEventListener("input", () => { askBtn.disabled = busy || !input.value.trim(); });
input.addEventListener("keydown", e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey) && !askBtn.disabled) onAsk(); });
askBtn.addEventListener("click", onAsk);

function setLoading(on) {
  busy = on;
  askBtn.disabled = on || !input.value.trim();
  if (on) askBtn.replaceChildren(el("span", { class: "spinner", "aria-hidden": "true" }), el("span", {}, t("ask_loading")));
  else askBtn.replaceChildren(t("ask_btn"));
}

async function onAsk() {
  const text = input.value.trim();
  if (!text || busy) return;
  stopListening();
  const local = detectSafety(text);
  if (local) { showSafety(local); return; }

  setLoading(true);
  const slow = setTimeout(() => {
    const label = askBtn.querySelector("span:last-child");
    if (busy && label) label.textContent = t("ask_waking");
  }, SLOW_NOTICE_MS);
  try {
    const r = await askServer(text);
    if (r.emergency) showSafety(r.emergency);
    else renderResult(r);
  } catch (e) {
    renderError();
  } finally {
    clearTimeout(slow);
    setLoading(false);
  }
}

/* =========================================================================
   11. START
   ========================================================================= */
load();
rememberBox.checked = state.remember;
applyLarge();
applyI18n();
if (state.onboarded) showMain("ask"); else showOnboarding();
</script>
